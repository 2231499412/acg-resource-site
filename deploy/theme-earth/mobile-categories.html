<th:block th:fragment="tree(categories)">
  <li th:each="category : ${categories}">
    <a th:if="${#lists.isEmpty(category.children)}" class="mobile-nav-link" th:href="@{${category.status.permalink}}">
      <span th:text="${category.spec.displayName}"></span><span class="mobile-nav-count" th:text="${category.postCount ?: 0}"></span>
    </a>
    <details th:unless="${#lists.isEmpty(category.children)}" class="mobile-nav-group">
      <summary><span th:text="${category.spec.displayName}"></span><span class="mobile-nav-chevron" aria-hidden="true"></span></summary>
      <ul class="mobile-nav-children">
        <li><a class="mobile-nav-link" th:href="@{${category.status.permalink}}">查看该分类全部文章<span class="mobile-nav-count" th:text="${category.postCount ?: 0}"></span></a></li>
        <th:block th:replace="~{modules/resource-mobile-categories :: tree(${category.children})}" />
      </ul>
    </details>
  </li>
</th:block>
